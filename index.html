<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍎 水果文案產生器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #fff8f3;
      color: #333;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #FF6B35, #f7c59f);
      color: white;
      text-align: center;
      padding: 28px 20px 22px;
    }
    header h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: 1px; }
    header p  { font-size: 0.9rem; margin-top: 6px; opacity: 0.9; }

    .container { max-width: 680px; margin: 0 auto; padding: 20px 16px 60px; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #FF6B35;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #666;
      display: block;
      margin-bottom: 5px;
      margin-top: 12px;
    }
    label:first-of-type { margin-top: 0; }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #ffd5be;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    input:focus { border-color: #FF6B35; }

    .row2 { display: flex; gap: 12px; }
    .row2 > div { flex: 1; }

    /* chips */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1.5px solid #e0e0e0;
      background: #f9f9f9;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .chip:hover { border-color: #FF6B35; color: #FF6B35; }
    .chip.active { background: #FF6B35; color: white; border-color: #FF6B35; }

    .country-chip:hover  { border-color: #43A047; color: #43A047; }
    .country-chip.active { background: #43A047; border-color: #43A047; color: white; }

    .cat-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #888;
      margin: 14px 0 6px;
    }

    /* emoji picker */
    .emoji-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .emoji-btn {
      font-size: 1.4rem;
      width: 42px; height: 42px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
      background: #f9f9f9;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .emoji-btn:hover  { border-color: #FF6B35; }
    .emoji-btn.active { border-color: #FF6B35; background: #fff3ee; }
    .emoji-custom {
      flex: 1;
      min-width: 80px;
      padding: 8px 12px;
      border: 2px solid #ffd5be;
      border-radius: 10px;
      font-size: 1.1rem;
      outline: none;
      font-family: inherit;
    }
    .emoji-custom:focus { border-color: #FF6B35; }

    /* 特色詞 */
    .trait-row { display: flex; gap: 8px; }
    .trait-row input { flex: 1; }

    /* custom bullet inputs */
    #bullet-list { display: flex; flex-direction: column; gap: 8px; }
    .bullet-item { display: flex; gap: 8px; align-items: center; }
    .bullet-item input { flex: 1; }
    .btn-remove {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 1.5px solid #ffcdd2;
      background: #fff5f5;
      color: #e57373;
      font-size: 1rem;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-remove:hover { background: #ffebee; }
    .btn-add-bullet {
      margin-top: 8px;
      padding: 8px 16px;
      border-radius: 10px;
      border: 1.5px dashed #ffd5be;
      background: transparent;
      color: #FF6B35;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-add-bullet:hover { background: #fff3ee; }

    /* generate */
    .btn-generate {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #FF6B35, #e8521e);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px rgba(255,107,53,0.35);
    }
    .btn-generate:hover  { opacity: 0.92; }
    .btn-generate:active { transform: scale(0.98); }

    /* output */
    #output-card { display: none; margin-top: 18px; }
    #output-card.show { display: block; }
    #output-text {
      width: 100%;
      min-height: 220px;
      padding: 14px;
      border: 2px solid #ffd5be;
      border-radius: 10px;
      font-size: 0.97rem;
      line-height: 1.8;
      resize: vertical;
      outline: none;
      font-family: inherit;
      color: #333;
    }
    #output-text:focus { border-color: #FF6B35; }
    .btn-copy {
      margin-top: 12px;
      width: 100%;
      padding: 13px;
      background: #fff;
      color: #FF6B35;
      border: 2px solid #FF6B35;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-copy:hover { background: #FF6B35; color: white; }
    .btn-copy.copied { background: #43A047; color: white; border-color: #43A047; }

    .tip {
      text-align: center;
      font-size: 0.8rem;
      color: #aaa;
      margin-top: -10px;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>

<header>
  <h1>🍎 水果文案產生器</h1>
  <p>填資訊・選賣點・一鍵輸出團購文案</p>
</header>

<div class="container">

  <!-- ① 基本資料 -->
  <div class="card">
    <div class="card-title">🍑 基本資料</div>

    <label>水果名稱</label>
    <input id="fruitName" type="text" placeholder="例：藍莓、草莓、葡萄…" />

    <label>水果 Emoji</label>
    <div class="emoji-row">
      <button class="emoji-btn" data-emoji="🫐">🫐</button>
      <button class="emoji-btn" data-emoji="🍓">🍓</button>
      <button class="emoji-btn" data-emoji="🍇">🍇</button>
      <button class="emoji-btn" data-emoji="🍊">🍊</button>
      <button class="emoji-btn" data-emoji="🍋">🍋</button>
      <button class="emoji-btn" data-emoji="🍎">🍎</button>
      <button class="emoji-btn" data-emoji="🍑">🍑</button>
      <button class="emoji-btn" data-emoji="🥭">🥭</button>
      <button class="emoji-btn" data-emoji="🍍">🍍</button>
      <button class="emoji-btn" data-emoji="🍈">🍈</button>
      <input class="emoji-custom" id="customEmoji" type="text" placeholder="其他…" maxlength="2" />
    </div>

    <label>標題特色詞（最多 3 個，顯示在第一行）</label>
    <div class="trait-row">
      <input id="trait1" type="text" placeholder="最新鮮" />
      <input id="trait2" type="text" placeholder="脆硬可口" />
      <input id="trait3" type="text" placeholder="酸酸甜甜" />
    </div>
  </div>

  <!-- ② 產地 -->
  <div class="card">
    <div class="card-title">🌍 產地</div>
    <div class="chips" id="originChips">
      <span class="chip country-chip" data-val="🇺🇸" data-name="美國">🇺🇸 美國</span>
      <span class="chip country-chip" data-val="🇨🇱" data-name="智利">🇨🇱 智利</span>
      <span class="chip country-chip" data-val="🇰🇷" data-name="韓國">🇰🇷 韓國</span>
      <span class="chip country-chip" data-val="🇯🇵" data-name="日本">🇯🇵 日本</span>
      <span class="chip country-chip" data-val="🇳🇿" data-name="紐西蘭">🇳🇿 紐西蘭</span>
      <span class="chip country-chip" data-val="🇦🇺" data-name="澳洲">🇦🇺 澳洲</span>
      <span class="chip country-chip" data-val="🇹🇼" data-name="台灣">🇹🇼 台灣</span>
      <span class="chip country-chip" data-val="🇲🇾" data-name="馬來西亞">🇲🇾 馬來西亞</span>
      <span class="chip country-chip" data-val="🇿🇦" data-name="南非">🇿🇦 南非</span>
      <span class="chip country-chip" data-val="🇵🇪" data-name="秘魯">🇵🇪 秘魯</span>
    </div>
  </div>

  <!-- ③ 規格價格 -->
  <div class="card">
    <div class="card-title">💰 規格 &amp; 價格</div>
    <label>規格（每盒重量）</label>
    <input id="spec" type="text" placeholder="例：125g、500g…" />
    <div class="row2" style="margin-top:12px;">
      <div>
        <label>單盒價格（元）</label>
        <input id="price1" type="number" placeholder="80" />
      </div>
      <div>
        <label>優惠幾盒</label>
        <input id="priceQty" type="number" placeholder="2" value="2" />
      </div>
      <div>
        <label>優惠價格（元）</label>
        <input id="price2" type="number" placeholder="150" />
      </div>
    </div>
  </div>

  <!-- ④ 賣點 -->
  <div class="card">
    <div class="card-title">✨ 賣點列表</div>

    <div class="cat-label">快選常用賣點（點擊新增）</div>
    <div class="chips">
      <span class="chip quick-chip" data-val="超級新鮮">超級新鮮</span>
      <span class="chip quick-chip" data-val="顆顆扎實飽滿">顆顆扎實飽滿</span>
      <span class="chip quick-chip" data-val="甜而帶點微酸 層次感超好吃">甜而帶點微酸 層次感超好吃</span>
      <span class="chip quick-chip" data-val="外皮漂亮 果粉完整保留">外皮漂亮 果粉完整保留</span>
      <span class="chip quick-chip" data-val="現貨搶購中 數量有限賣完不補">現貨搶購中 數量有限賣完不補</span>
      <span class="chip quick-chip" data-val="產地直送 最新鮮">產地直送 最新鮮</span>
      <span class="chip quick-chip" data-val="大人小孩都喜歡 超級好吃唷">大人小孩都喜歡 超級好吃唷</span>
      <span class="chip quick-chip" data-val="爆漿多汁">爆漿多汁</span>
      <span class="chip quick-chip" data-val="入口即化">入口即化</span>
      <span class="chip quick-chip" data-val="皮薄無籽">皮薄無籽</span>
      <span class="chip quick-chip" data-val="當季限定">當季限定</span>
      <span class="chip quick-chip" data-val="這批超划算">這批超划算</span>
      <span class="chip quick-chip" data-val="自吃送禮都體面">自吃送禮都體面</span>
      <span class="chip quick-chip" data-val="手腳慢搶不到">手腳慢搶不到</span>
    </div>

    <div class="cat-label" style="margin-top:16px;">目前賣點列表（可拖曳排序、點 × 刪除）</div>
    <div id="bullet-list"></div>
    <button class="btn-add-bullet" onclick="addBullet('')">＋ 手動新增賣點</button>
  </div>

  <p class="tip">填完所有欄位後按產生 👇</p>
  <button class="btn-generate" onclick="generate()">🚀 產生文案</button>

  <!-- 輸出 -->
  <div class="card" id="output-card">
    <div class="card-title">📝 你的文案</div>
    <textarea id="output-text" readonly></textarea>
    <button class="btn-copy" id="copyBtn" onclick="copyText()">📋 複製文案</button>
  </div>

</div>

<script>
  // ── emoji picker ──
  let selectedEmoji = '';
  document.querySelectorAll('.emoji-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedEmoji = btn.dataset.emoji;
      document.getElementById('customEmoji').value = '';
    });
  });
  document.getElementById('customEmoji').addEventListener('input', e => {
    selectedEmoji = e.target.value.trim();
    document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('active'));
  });

  // ── 產地 single select ──
  document.querySelectorAll('.country-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.country-chip').forEach(c => c.classList.remove('active'));
      chip.classList.toggle('active');
    });
  });

  // ── 快選賣點 ──
  document.querySelectorAll('.quick-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      addBullet(chip.dataset.val);
    });
  });

  // ── bullet list ──
  let bulletCount = 0;

  function addBullet(text) {
    const id = 'b' + (bulletCount++);
    const div = document.createElement('div');
    div.className = 'bullet-item';
    div.id = id;
    div.innerHTML = `
      <span style="color:#FF6B35;font-size:1.1rem;flex-shrink:0;">．</span>
      <input type="text" value="${text.replace(/"/g, '&quot;')}" placeholder="輸入賣點…" />
      <button class="btn-remove" onclick="removeBullet('${id}')">×</button>
    `;
    document.getElementById('bullet-list').appendChild(div);
  }

  function removeBullet(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  // ── generate ──
  function generate() {
    const fruit   = document.getElementById('fruitName').value.trim();
    const emoji   = selectedEmoji || document.getElementById('customEmoji').value.trim() || '🍎';
    const trait1  = document.getElementById('trait1').value.trim();
    const trait2  = document.getElementById('trait2').value.trim();
    const trait3  = document.getElementById('trait3').value.trim();
    const spec    = document.getElementById('spec').value.trim();
    const price1  = document.getElementById('price1').value.trim();
    const priceQty= document.getElementById('priceQty').value.trim() || '2';
    const price2  = document.getElementById('price2').value.trim();

    const activeCountry = document.querySelector('.country-chip.active');
    const flag    = activeCountry ? activeCountry.dataset.val : '';
    const country = activeCountry ? activeCountry.dataset.name : '';

    if (!fruit) { alert('請輸入水果名稱！'); return; }

    // 標題行
    const traits = [trait1, trait2, trait3].filter(Boolean).join('  ');
    const titleLine = [
      flag ? flag + country + '來台' : '',
      traits,
      fruit + ' ' + emoji
    ].filter(Boolean).join('  ');

    // 價格行
    let priceLine = '';
    if (price1 || price2) {
      const parts = [];
      if (price1 && spec) parts.push(`${emoji}1盒 ${spec}  ${price1}元`);
      else if (price1)    parts.push(`${emoji}1盒  ${price1}元`);
      if (price2 && priceQty) parts.push(`${priceQty}盒 ${price2}元${emoji}`);
      priceLine = parts.join(' / ');
    }

    // 賣點
    const bullets = [...document.querySelectorAll('#bullet-list input')]
      .map(i => i.value.trim())
      .filter(Boolean)
      .map(t => `．${t}`)
      .join('\n');

    // 組合
    const lines = [];
    lines.push(titleLine);
    if (priceLine) { lines.push(''); lines.push(priceLine); }
    if (bullets)   { lines.push(''); lines.push(bullets); }

    document.getElementById('output-text').value = lines.join('\n');
    const card = document.getElementById('output-card');
    card.classList.add('show');
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });

    const btn = document.getElementById('copyBtn');
    btn.textContent = '📋 複製文案';
    btn.classList.remove('copied');
  }

  // ── copy ──
  function copyText() {
    const text = document.getElementById('output-text').value;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✅ 已複製！';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 複製文案';
        btn.classList.remove('copied');
      }, 2500);
    });
  }
</script>

</body>
</html>
